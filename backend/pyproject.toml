[project]
name = "llm-trainer"
version = "0.1.0"
description = "Local web app to fine-tune, evaluate and serve LLMs, with RAG, agents and visual flows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "nvidia-ml-py>=12.560",
    "psutil>=6.0",
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "sentence-transformers>=3.2",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "huggingface-hub>=0.26",
    "pandas>=2.2",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "mcp>=2.2.0",
    "lm-eval>=0.4.13",
    "scipy>=1.18.1",
    "docling>=2.129.0",
    "torchvision>=0.26.0",
    "ddgs>=9.16.0",
    "networkx>=3.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
# GPU inference for GGUF models. Installed by backend/setup-llamacpp.sh (it needs SPIRV-Headers, built into tools/)
gguf = ["llama-cpp-python>=0.3.35"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# llama-cpp-python is built from source with the Vulkan backend (it runs on the GPU without the CUDA
# toolkit) and with this CPU's native instructions. The prebuilt wheels use AVX-512 and crash with
# SIGILL on CPUs that don't have it.
[tool.uv.extra-build-variables]
llama-cpp-python = { CMAKE_ARGS = "-DGGML_VULKAN=on -DGGML_NATIVE=on", FORCE_CMAKE = "1" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
